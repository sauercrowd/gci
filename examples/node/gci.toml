app = "nodeapp"

[images.web]
packages = ["nodejs_22"]
source = "./app"
snapshot_step = "deps"
steps = [
  { name = "deps", run = "npm install --no-audit --no-fund" },
  { name = "build", run = "npm run build" },
]

[services.web]
image = "web"
command = "node server.js"
port = 8080
health = "/healthz"
routes = [{ host = "node.localhost", prefix = "/" }]
env = { APP_VERSION = "1.0.0" }
secrets = { SESSION_SECRET = "session-secret" }
